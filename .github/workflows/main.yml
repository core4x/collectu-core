name: Test and Release

# Tests every push to development and main, and every pull request. Only main releases.
#
# A release is a tag and a GitHub release, never a commit: python-semantic-release tags the
# commit that was pushed and writes the release notes onto the GitHub release, and nothing is
# pushed to the branch. So main never gets ahead of development, and promoting is a fast-forward
# of the exact commit that passed the tests there:
#
#   git push origin development:main
on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

# One run per branch at a time, queued rather than cancelled. Two releases racing would compute
# the same next version from the same tag, and a run cancelled half-way could leave a tag without
# an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  execute-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The line the image ships (the Dockerfile's python:3.13), so what passes here is what
          # runs there - not whichever Python the runner image happens to carry.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: pip install -r src/requirements.txt
      - name: Run tests
        working-directory: src/test
        run: python test.py

  create-release:
    needs: execute-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Pushes the tag and creates the GitHub release.
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Semantic-release reads the history back to the previous tag to decide the bump, so a
          # shallow clone gives it nothing to decide from.
          fetch-depth: 0
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tag the pushed commit instead of committing a version bump on top of it. That commit
          # put main one ahead of development after every release, so every promotion and every
          # pull afterwards needed a merge.
          commit: false
          # The release notes go onto the GitHub release, which is the changelog. A
          # CHANGELOG.md in the repository could only be kept current by that commit.
          changelog: false

  build-and-push:
    needs: create-release
    # Only when this push made a release. Otherwise a push that released nothing (docs:, chore:,
    # a merge) rebuilt the image and pushed it under the previous version's tag.
    if: needs.create-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Only the Dockerfile is read from here; the image clones the repository itself.
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: collectu
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            collectu/collectu-core
          # The highest-priority tag becomes the org.opencontainers.image.version label. At equal
          # priority that was `latest`, so the version was not readable off a pulled image.
          tags: |
            type=raw,value=${{ needs.create-release.outputs.tag }},priority=1000
            type=raw,value=latest

      - name: Build and push Docker images
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          platforms: ${{ env.PLATFORMS }}
          # The Dockerfile clones the repository; this is the commit it checks out. The release
          # tag is on it - whatever main has moved on to by the time the build runs.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attaches an SPDX SBOM and a provenance attestation to the pushed manifest, so the
          # image carries a bill of materials wherever it is pulled from. This is the registry
          # half of the answer; the CycloneDX documents produced by release-sbom below are the
          # ones our own tooling consumes.
          sbom: true
          provenance: mode=max

  release-sbom:
    # Two CycloneDX SBOMs, attached to the GitHub release rather than committed. A commit would
    # put main ahead of development again, and it would land after the tag, so the tagged tree
    # would carry the previous release's document.
    #
    #  - sbom.cdx.json: what the repository declares, scanned from src/requirements.txt. Only this
    #    repository's own requirements: src/interface is a submodule with its own repository and
    #    its own SBOM, and actions/checkout does not fetch submodules here.
    #  - sbom.container.cdx.json: a syft scan of the image that was actually published. Unlike
    #    the declared one it also covers the operating system packages - openssl, glibc, busybox -
    #    which is where the vulnerabilities that matter for an industrial gateway live. Scanned
    #    once here, on a known platform, rather than by every device parsing package databases at
    #    runtime.
    needs: [create-release, build-and-push]
    if: needs.create-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Uploads the release assets.
      contents: write
      packages: read
    env:
      TAG: ${{ needs.create-release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate the declared SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          # Scoping lives in .syft.yaml rather than here: it keeps the exclusions next to the
          # reasoning for them, and makes the same document reproducible outside CI with a plain
          # `syft scan dir:.` from the repository root.
          config: .syft.yaml
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the published image
        uses: anchore/sbom-action@v0
        with:
          # By digest: exactly what build-and-push pushed. One platform is enough: the Python
          # distributions are identical across them and the OS package set differs only in
          # architecture-specific builds of the same packages.
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.container.cdx.json
          upload-artifact: false
          # Only attaches when the workflow runs for a `release` event; this one runs for a push,
          # so the step below does it.
          upload-release-assets: false

      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --clobber so that re-running this job replaces the files rather than failing on them.
        run: gh release upload "$TAG" sbom.cdx.json sbom.container.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
