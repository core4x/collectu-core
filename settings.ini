[env]
# the persistent app id.
app_id = fd497070-eeeb-4a8d-b864-157a151f5674
# the enterprise. only needed if this app does not report to the hub.
enterprise =
# the site, e.g. the plant or location.
site =
# the area within the site.
area =
# the work center, e.g. a production line or cell.
work_center =
# the work unit, e.g. the machine.
work_unit =
# the equipment module, e.g. a functional unit of the machine.
equipment_module =
# the control module aka app_description. if not given, the hostname is used.
app_description = ap-xrf02
# the filepath to the configuration file.
config = configuration.yml
# load configuration file on start-up.
auto_start = 1
# automatically install third party requirements.
auto_install = 1
# automatically download modules from hub during first start.
initial_download = 1
# automatically download modules if they do not exist locally.
auto_download = 1
# start the api.
api = 1
# host address of the api.
api_host = 0.0.0.0
# port of the api.
api_port = 8181
# is authentication required.
api_authentication = 0
# local admin username.
local_admin_username = admin
# local admin password.
local_admin_password = >LHyU!z2M8fNk4aL
# start the mcp server.
mcp = 1
# serve the frontend.
frontend = 1
# the host addresses of the motherships to report to.
motherships = ["http://localhost:8181"]
# the api access token of the hub.
hub_api_access_token = 
# use hub as mothership. a hub profile is required.
report_to_hub = 1
# your custom module folder located in modules.
custom_module_folder = 
# comma-separated list of the allowed commands that will be executed if they are provided by the motherships or the hub.
allowed_commands = restart,start,stop,update,load,save

